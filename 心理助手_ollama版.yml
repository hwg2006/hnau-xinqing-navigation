    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 50
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '你好，我是华农心晴导航，一个校园心理支持AI助手，不是真人心理老师，也不能替代心理咨询师或医生。


      如果你愿意，可以和我聊聊最近的压力、心情，或者学业和人际关系上的困扰。

      我也可以帮你做GAD-7焦虑自测、性格偏好小游戏，或查询校园心理服务和老师公开信息。


      为保护隐私，请不要发送姓名、学号、身份证号、电话、住址等身份信息；对话内容可能按学校平台的管理规则留存和处理。

      如果遇到紧急情况，请立即拨打 12356 或 120。'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我最近考试压力很大，睡不着怎么办？
    - 帮我做一个焦虑自测（GAD-7）
    - 怎么预约学校的心理咨询？
    - 最近感觉很累，什么都不想做
    - 帮我查一下心理老师的信息
    - 我想做快速心情打卡
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
