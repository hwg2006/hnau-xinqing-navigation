        code: "import re\n\ndef main(llm_text: str) -> dict:\n    text = llm_text\n    # 移除「对话摘要」及之后所有内容\n    text = re.sub(r\"\\n*对话摘要[\\s\\S]*$\", \"\", text)\n    # 移除「如需专业支持」及之后所有内容\n    text = re.sub(r\"\\n*如需专业支持[\\s\\S]*$\", \"\", text)\n    # 移除「情绪状态：」开头的行及后续\n    text = re.sub(r\"\\n*情绪状态：[\\s\\S]*$\", \"\", text)\n    # 移除「讨论话题：」开头的行及后续\n    text = re.sub(r\"\\n*讨论话题：[\\s\\S]*$\", \"\", text)\n    # 移除「建议事项：」开头的行及后续\n    text = re.sub(r\"\\n*建议事项：[\\s\\S]*$\", \"\", text)\n    # 清理末尾多余空行\n    text = text.rstrip()\n    return {\"text\": text}\n"
