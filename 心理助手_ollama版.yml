    - data:
        code: "def main(query: str, step: str, scores: str, existing_level: str) -> dict:\n    questions = [\n        \"过去两周，你感到紧张、焦虑或烦躁的频率是？\",\n        \"过去两周，你无法停止或控制担忧的频率是？\",\n        \"过去两周，你对各种事情担忧过多的频率是？\",\n        \"过去两周，你很难放松下来的频率是？\",\n        \"过去两周，你因为不安而难以静坐的频率是？\",\n        \"过去两周，你变得容易烦恼或急躁的频率是？\",\n        \"过去两周，你感到害怕，仿佛将有可怕事情发生的频率是？\",\n    ]\n    options = \"请回复：0 完全没有｜1 有几天｜2 一半以上天数｜3 几乎每天\"\n    q = (query or \"\").strip()\n    try:\n        current_step = int(step or \"0\")\n    except Exception:\n        current_step = 0\n    saved = [x for x in (scores or \"\").split(\",\") if x in (\"0\", \"1\", \"2\", \"3\")]\n\n    if current_step < 0 or current_step > 7 or len(saved) != max(current_step - 1, 0):\n        current_step, saved = 0, []\n\n    if current_step == 0:\n        text = \"这是一个过去两周焦虑感受的7题筛查，不是医学诊断。我会一次问一题。\\n\\n第1/7题：\" + questions[0] + \"\\n\" + options\n        return {\"result\": text, \"step\": \"1\", \"scores\": \"\", \"level\": existing_level or \"\"}\n\n    if any(word in q for word in (\"退出\", \"取消\", \"不做了\", \"停止测试\", \"结束测试\")):\n        return {\"result\": \"好的，已退出本次GAD-7自测，之前未完成的答案不会用于计分。\", \"step\": \"0\", \"scores\": \"\", \"level\": existing_level or \"\"}\n\n    normalized = q.replace(\" \", \"\").replace(\"。\", \"\").replace(\"，\", \"\")\n    mapping = {\n        \"0\": 0, \"完全没有\": 0, \"从来没有\": 0, \"没有\": 0, \"从不\": 0,\n        \"1\": 1, \"有几天\": 1, \"偶尔\": 1, \"很少\": 1,\n        \"2\": 2, \"一半以上\": 2, \"超过一半\": 2, \"经常\": 2,\n        \"3\": 3, \"几乎每天\": 3, \"每天\": 3, \"总是\": 3,\n    }\n    score = mapping.get(normalized)\n    if score is None:\n        return {\"result\": f\"我还没识别出你的选项。第{current_step}/7题请按下面格式回答：\\n{options}\", \"step\": str(current_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n\n    saved.append(str(score))\n    if current_step < 7:\n        next_step = current_step + 1\n        text = f\"已记录。\\n\\n第{next_step}/7题：{questions[next_step - 1]}\\n{options}\"\n        return {\"result\": text, \"step\": str(next_step), \"scores\": \",\".join(saved), \"level\": existing_level or \"\"}\n\n    total = sum(int(x) for x in saved)\n    if total <= 4:\n        level = \"无或极轻微\"\n        advice = \"目前焦虑感受不明显，可以继续保持规律作息并留意变化。\"\n    elif total <= 9:\n        level = \"轻度\"\n        advice = \"可以尝试规律睡眠、适量运动和放松练习；若持续困扰，可预约心理咨询。\"\n    elif total <= 14:\n        level = \"中度\"\n        advice = \"建议预约学校心理咨询，与专业人员进一步聊聊近期影响。\"\n    else:\n        level = \"重度\"\n        advice = \"建议尽快联系学校心理中心或其他专业机构进一步评估。\"\n    text = f\"本次GAD-7总分为 {total}/21，属于{level}范围。{advice}\\n\\n这个结果只用于筛查，不能替代诊断。如果你现在有伤害自己或无法保证安全的想法，请立即联系身边可信任的人，并拨打12356、120或110。\"\n    return {\"result\": text, \"step\": \"0\", \"scores\": \"\", \"level\": level}"
