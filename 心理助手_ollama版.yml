    - data:
        code: "def main(query: str, current_time: str) -> dict:\n    teachers = [\n        {\"name\": \"梁小伊\", \"title\": \"教授/国家二级心理咨询师\", \"specialty\": \"环境适应、压力应对、人际交往、职业规划、抑郁焦虑、情感障碍、异常心理、危机识别干预\"},\n        {\"name\": \"刘信洪\", \"title\": \"西南师大心理学硕士/清华教育博士\", \"specialty\": \"认知心理、精神分析、学业困惑、人际困惑、情感困惑\"},\n        {\"name\": \"王伍香\", \"title\": \"国家二级心理咨询师(2014)\", \"specialty\": \"各年龄段学生心理\"},\n        {\"name\": \"成华青\", \"title\": \"中山大学法学硕士/副教授/国家三级心理咨询师\", \"specialty\": \"个体成长、亲子关系\"},\n        {\"name\": \"陈巍\", \"title\": \"国家心理咨询师/职业指导师\", \"specialty\": \"生涯规划、人际交往、学业压力、情绪情感\"},\n        {\"name\": \"陈智欣\", \"title\": \"广州中医药大学七年制本硕中医学/国家二级心理咨询师\", \"specialty\": \"新生适应、亲密关系、情绪管理、自我成长\"},\n        {\"name\": \"马晓莉\", \"title\": \"国家二级心理咨询师\", \"specialty\": \"情绪情感、人际关系、家庭问题\"},\n        {\"name\": \"苏安梅\", \"title\": \"外语学院教师/13年教学/国家二级心理咨询师/正面管教讲师\", \"specialty\": \"自我成长、亲子关系、家庭关系、情绪管理\"},\n        {\"name\": \"陈坤钰\", \"title\": \"本科广外应用心理学/硕士华师应用心理学/国家二级心理咨询师\", \"specialty\": \"自我成长、人际关系、情绪管理\"},\n        {\"name\": \"李佳媛\", \"title\": \"国家三级心理咨询师/国家三级职业指导师\", \"specialty\": \"学习问题、人际关系、职业规划\"},\n        {\"name\": \"梁娟\", \"title\": \"本科河南师大心理学/硕士华师心理学/国家二级心理咨询师\", \"specialty\": \"自我成长、情绪情感、亲子关系、亲密关系\"},\n        {\"name\": \"石如彬\", \"title\": \"硕士华师心理学院/国家二级心理咨询师\", \"specialty\": \"生涯规划、人际交往、学业压力、情绪情感\"},\n        {\"name\": \"何凯\", \"title\": \"经管学院辅导员/国家二级心理咨询师/绘画心理分析师\", \"specialty\": \"辅导员支持视角\"},\n        {\"name\": \"严颖\", \"title\": \"数信学院辅导员/福建师大发展与教育心理学硕士/国家二级心理咨询师\", \"specialty\": \"新生适应、恋爱情感、人际关系、团体辅导\"},\n        {\"name\": \"叶昶\", \"title\": \"华南师大应用心理硕士\", \"specialty\": \"新生适应、情绪管理、人际关系、家庭问题\"},\n        {\"name\": \"陈丽冰\", \"title\": \"国家二级心理咨询师/国家二级职业指导师\", \"specialty\": \"个体成长、人际关系、职业规划\"},\n        {\"name\": \"叶晓燕\", \"title\": \"国家二级心理咨询师/初级心理治疗师\", \"specialty\": \"发展性咨询、情绪情感、人际关系、学习问题、异常心理识别\"},\n    ]\n\n    if any(kw in query for kw in ['男老师', '女老师', '男性咨询师', '女性咨询师']):\n        return {\"result\": \"当前公开资料没有经过核实的老师性别字段，我不能根据姓名推测。建议联系心理中心说明你的偏好，由工作人员在可选范围内协助匹配。\"}\n\n    booking_kw = ['预约', '怎么约', '如何预约', '预约流程', '预约方式', '线上预约', '公众号']\n    if any(kw in query for kw in booking_kw):\n        return {\"result\": \"预约心理咨询挺方便的，有三种方式：\\n\\n线上预约的话，打开「华南农业大学心理中心」公众号，点「心理服务」→「移动心理」，用学号和门户密码登录，就能看到可以预约的时段和老师了。\\n\\n也可以打电话预约，号码是 020-85280085 或 85283422，工作时间每天早上 8:30 到 12:00、下午 2:30 到 8:00 都有人接。\\n\\n或者直接来华山新学生活动中心三楼 308 咨询接待室，学期内上班时间都可以现场预约。\\n\\n具体费用、开放时间、保密边界和取消规则可能调整，建议预约时以心理中心最新说明为准。\"}\n\n    if any(kw in query for kw in ['收费', '要钱', '免费', '费用']):\n        return {\"result\": \"根据当前项目资料，在校学生心理咨询通常免费；具体请以心理中心最新通知或预约时的说明为准。\"}\n\n    if any(kw in query for kw in ['保密', '辅导员', '泄露', '隐私']):\n        return {\"result\": \"心理咨询通常遵循保密原则，具体保密边界会在咨询前进行知情说明；如果存在危及本人或他人安全等情况，可能依法依规启动必要干预。建议预约时向心理中心确认现行规定。\"}\n\n    if any(kw in query for kw in ['电话', '地址', '在哪', '哪里', '几点', '时间', '开门']):\n        return {\"result\": \"心理中心在华山新学生活动中心三楼 308，电话是 020-85280085 或 85283422。项目资料中的工作时间为每天8:30-12:00、14:30-20:00；节假日和寒暑假可能调整，出发前建议电话确认。\"}\n\n    for t in teachers:\n        if t['name'] in query:\n            return {'result': f\"关于 {t['name']} 老师：\\n\\n{t['title']}\\n\\n擅长的方向是：{t['specialty']}\\n\\n如果想约这位老师，可以打电话 020-85280085 说明你的需求，接线人员会帮你看看能不能安排。\"}\n\n    # 处理纠正场景：如果用户说「不是/不对/搞错了」且 query 较短，尝试提取有效关键词\n    neg_words = ['不是', '不对', '搞错了', '错了', '我说的是', '是']\n    if any(nw in query for nw in neg_words) and len(query) < 30:\n        # 这是一个纠正消息，尝试从 query 中提取关键词直接匹配\n        pass  # 继续往下走正常匹配流程\n    match_kw = ['焦虑', '抑郁', '睡眠', '失眠', '人际', '情绪', '适应', '职业', '生涯', '学业', '压力', '家庭', '亲子', '情感', '恋爱', '成长', '危机', '胃口', '食欲', '饮食', '躯体', '身体', '焦躁', '躁', '狂躁', '躁郁']\n    for kw in match_kw:\n        if kw in query:\n            matched = [t for t in teachers if kw in t['specialty']]\n            if matched:\n                lines = [f\"根据你说的「{kw}」这个方向，我帮你找了几位这方面比较擅长的老师：\\n\"]\n                for m in matched[:3]:\n                    lines.append(f\"{m['name']} 老师 | {m['title']}\\n  擅长：{m['specialty']}\\n\")\n                lines.append(\"如果想预约的话，可以打电话 020-85280085，接线人员会帮你匹配最合适的时段。\\n\")\n                return {\"result\": \"\".join(lines)}\n            else:\n                lines = [f\"你提到的「{kw}」这个方向，目前公开的信息里没有完全匹配的老师。不过我把所有老师都列出来，你看看有没有觉得合适的：\\n\\n\"]\n                for i, t in enumerate(teachers, 1):\n                    lines.append(f\"{i}. {t['name']} 老师 | {t['title']} | {t['specialty']}\\n\")\n                lines.append(\"\\n建议打电话 020-85280085 说明你的需求，接线人员会帮你匹配最合适的老师。\\n\")\n                return {\"result\": \"\".join(lines)}\n\n    rec_kw = ['推荐', '适合', '合适', '擅长']\n    if any(kw in query for kw in rec_kw):\n        lines = [\"这是我们心理中心目前所有老师的名单，你可以看看有没有觉得合适的：\\n\\n\"]\n        for i, t in enumerate(teachers, 1):\n            lines.append(f\"{i}. {t['name']} 老师 | {t['title']} | {t['specialty']}\\n\")\n        lines.append(\"\\n如果想预约，打电话 020-85280085，接线人员会帮你匹配最合适的老师。\\n\")\n        return {\"result\": \"\".join(lines)}\n\n    list_kw = ['所有', '全部', '有哪些', '名录', '名单', '展示', '列出', '几个', '多少', '介绍', '咨询师']\n    if any(kw in query for kw in list_kw):\n        lines = [\"我们心理中心目前有 17 位兼职心理咨询师，这是他们的名单：\\n\\n\"]\n        for i, t in enumerate(teachers, 1):\n            lines.append(f\"{i}. {t['name']} 老师 | {t['title']} | {t['specialty']}\\n\")\n        lines.append(\"\\n具体排班是心理中心统一安排的，预约的时候接线人员会帮你匹配合适的老师和时段。如果想预约的话，打电话 020-85280085 或者在公众号上预约都可以。\\n\")\n        return {\"result\": \"\".join(lines)}\n\n    return {\"result\": \"关于心理老师，你想了解哪方面呢？我可以帮你查查某位老师擅长的方向，也可以按你遇到的问题帮你推荐合适的老师，或者直接列出所有老师的名单给你看看。\"}\n"
