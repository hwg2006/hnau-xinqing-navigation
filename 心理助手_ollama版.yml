        code: "def main(query: str, current_step: str, answers: str, current_count: str) -> dict:\n    q = (query or \"\").strip()\n    try:\n        step = int(current_step or \"0\")\n    except Exception:\n        step = 0\n    try:\n        count = max(int(current_count or \"0\"), 0)\n    except Exception:\n        count = 0\n    saved = (answers or \"\").split(\"|||\") if answers else []\n    if step < 0 or step > 3 or len(saved) != max(step - 1, 0):\n        step, saved = 0, []\n\n    if step == 0:\n        return {\"result\": \"我们做一个3题快速心情打卡吧。\\n\\n第1/3题：你现在的情绪温度是多少？请回复0-10分，0表示非常低落，10表示状态很好。\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n\n    if any(word in q for word in (\"退出\", \"取消\", \"不做了\", \"停止打卡\", \"结束打卡\")):\n        return {\"result\": \"好的，已退出本次心情打卡。\", \"step\": \"0\", \"answers\": \"\", \"count\": str(count)}\n\n    if step == 1:\n        if not q.isdigit() or not 0 <= int(q) <= 10:\n            return {\"result\": \"请输入0到10之间的整数。例如：6。\\n\\n第1/3题：你现在的情绪温度是多少？\", \"step\": \"1\", \"answers\": \"\", \"count\": str(count)}\n        saved = [q]\n        return {\"result\": \"已记录。\\n\\n第2/3题：最近有什么事情让你比较在意？\", \"step\": \"2\", \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    clean = q.replace(\"|||\", \"｜\")[:300]\n    if not clean:\n        question = \"最近有什么事情让你比较在意？\" if step == 2 else \"今天有没有什么小事让你感觉好一点？\"\n        return {\"result\": f\"可以简单说一句就好。\\n\\n第{step}/3题：{question}\", \"step\": str(step), \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    if step == 2:\n        saved.append(clean)\n        return {\"result\": \"谢谢你告诉我。\\n\\n第3/3题：今天有没有什么小事让你感觉好一点？如果暂时没有，也可以直接说“没有”。\", \"step\": \"3\", \"answers\": \"|||\".join(saved), \"count\": str(count)}\n\n    mood = int(saved[0])\n    concern = saved[1]\n    new_count = count + 1\n    if mood <= 3:\n        advice = \"你今天的状态偏低，先把目标放小一点，照顾好吃饭、休息和安全；如果这种状态持续或影响生活，可以联系学校心理中心。\"\n    elif mood <= 6:\n        advice = \"今天似乎有些消耗，可以给自己安排一个十分钟的放松或散步时间。\"\n    else:\n        advice = \"你今天整体状态还可以，可以留意并延续让自己感觉好一点的小事。\"\n    text = f\"第{new_count}次打卡完成：情绪温度 {mood}/10。你在意的是“{concern}”。{advice}\"\n    return {\"result\": text, \"step\": \"0\", \"answers\": \"\", \"count\": str(new_count)}"
