    - data:
        desc: 识别用户意图（8类），仅发送精简指令给API，不含敏感词示例
        instruction: '从用户输入中识别意图，只返回以下枚举值之一：


          用户输入：{{#sys.query#}}


          上一轮对话摘要：{{#conversation.counseling#}}

          上一轮用户困扰：{{#conversation.core_issue#}}


          注意：如果用户说「不是」「不对」「搞错了」「我说的是」等纠正性词语，请结合上一轮对话内容理解用户真正想问什么，不要因为否定词而误判为distress。例如：上一轮聊老师推荐，这一轮说「不是，是焦躁症」→ 仍然是 teacher_query。

          多轮测评连续性：

          - 当前GAD-7题号：{{#conversation.gad7_step#}}。只要该值不是0，用户的0/1/2/3、从来没有、有几天、一半以上、几乎每天以及“退出/取消/不做了”等回复，都必须判定为 gad7_test。

          - 当前性格小游戏题号：{{#conversation.personality_step#}}。只要该值不是0，用户的A/B、选A/选B、前者/后者以及“退出/取消/不做了”等回复，都必须判定为 personality_test。

          - 当前快速心情打卡题号：{{#conversation.light_step#}}。只要该值不是0，用户对情绪温度和后续两题的回答，以及“退出/取消/不做了”等回复，都必须判定为 light_assess。

          - 危机意图始终高于测评连续性；如果测评中出现安全风险表达，仍判定为危机意图。

          意图枚举：

          - crisis_immediate: 用户明确表示处于紧急危险中，无法保证自身安全

          - crisis_high_risk: 用户表达明显的安全风险想法，但未处于即时危险

          - distress: 用户表达情绪困扰、压力、学业/人际关系等一般心理需求，或普通问候

          - gad7_test: 用户主动要求做焦虑自测、GAD-7量表

          - personality_test: 用户主动要求做性格/人格测试、MBTI

          - campus_service: 用户询问校园心理服务（预约流程、地址、电话、开放时间、收费等）——注意：不含老师个人信息

          - teacher_query: 用户询问心理老师信息、专长方向、擅长领域、老师名录，或根据自身症状/困扰要求推荐合适的老师

          - light_assess: 用户主动要求做快速心情打卡、3题小测评


          判定优先级：crisis_immediate > crisis_high_risk > teacher_query/gad7_test/personality_test/light_assess/campus_service > distress


          重要区分：用户描述症状+要求推荐老师 → teacher_query（即使有情绪描述也优先判此类）；问「有哪些老师」「推荐擅长XX的老师」「给我推荐老师」→ teacher_query；问「怎么预约」「心理中心在哪」「电话多少」→ campus_service。'
